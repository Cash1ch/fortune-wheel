name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev build-essential ccache
          sudo apt-get install -y libtinfo5 || true

      - name: Install Buildozer
        run: pip install buildozer "cython==0.29.36" setuptools

      - name: Build APK
        run: yes | buildozer -v android debug > build.log 2>&1

      - name: Show end of log (on failure)
        if: failure()
        run: |
          echo "=== ERRORS ==="
          grep -n -i -E "error|failed|traceback|not found|cannot" build.log | grep -v -i "deprecated" | tail -n 40
          echo "=== LAST 60 LINES ==="
          tail -n 60 build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fortune-wheel-apk
          path: bin/*.apk
          if-no-files-found: error
